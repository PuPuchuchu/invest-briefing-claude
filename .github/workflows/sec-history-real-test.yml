name: SEC History Real Data Test

on:
  workflow_dispatch:

jobs:
  sec-history-real-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Fetch SEC Company Facts
        continue-on-error: true
        env:
          SEC_USER_AGENT: "invest-briefing-claude/0.1 chks7788@gmail.com"
        run: |
          python tests/test_sec_companyfacts.py

      - name: Run real SEC history tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_sec_history_real.py
