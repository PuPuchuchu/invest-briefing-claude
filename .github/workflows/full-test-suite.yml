name: Full Test Suite

# Runs the entire tests/ directory, uploads a JUnit report, and applies the
# full-suite regression gate (DEC-025 merge criterion; DEC-027).
#
# The job succeeds when there is NO REGRESSION against
# .github/ci/full_suite_baseline.json. It does NOT mean every test passed:
# the baseline's known failures may keep failing and are listed in the job
# summary, never counted as passing. Tests that depend on protected modules
# are evaluated by counts only.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  full-suite-regression-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run full test suite
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          pytest tests/ -q -rfEs --junitxml=pytest-report.xml
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "pytest exit code: $rc"
          exit 0

      - name: Regression gate
        run: |
          python .github/scripts/check_test_regression.py \
            --report pytest-report.xml \
            --baseline .github/ci/full_suite_baseline.json \
            --pytest-exit-code "${{ steps.pytest.outputs.exit_code }}" \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --json-out regression-gate.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-suite-report
          path: |
            pytest-report.xml
            regression-gate.json
          if-no-files-found: warn
