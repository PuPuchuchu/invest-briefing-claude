name: Full Test Suite

# Runs the entire tests/ directory and uploads a JUnit report, so test results
# (including tests that depend on protected modules) are produced by CI rather
# than inspected in a chat session.
# workflow_dispatch only works once this file is on the default branch, so a
# push trigger limited to the feature branch is included for that branch.
on:
  workflow_dispatch:
  push:
    branches:
      - step14-company-type
      - step15-batch-runner

jobs:
  full-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -q -rfEs --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-suite-report
          path: pytest-report.xml
