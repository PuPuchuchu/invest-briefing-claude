name: Price Engine Test

# Synthetic-fixture tests for src/price (common price calculation engine v1).
# No network data, no API keys, no secrets are used by these tests
# (the Massive adapter and runner are tested with a fake transport).

on:
  push:
    paths:
      - "src/price/**"
      - "src/price_providers/**"
      - "scripts/run_price_briefing.py"
      - "data/reference/us_market_calendar.csv"
      - "tests/test_price_*.py"
      - ".github/workflows/price-engine-test.yml"
  pull_request:
    paths:
      - "src/price/**"
      - "src/price_providers/**"
      - "scripts/run_price_briefing.py"
      - "data/reference/us_market_calendar.csv"
      - "tests/test_price_*.py"
      - ".github/workflows/price-engine-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-engine-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4 tag, verified via git ls-remote 2026-11-27)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (= v5 tag, verified via git ls-remote 2026-11-27)
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install pytest
        run: |
          pip install pytest

      - name: Run price engine tests
        run: |
          python -m pytest tests/test_price_*.py -v
