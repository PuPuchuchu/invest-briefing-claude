name: Fundamentals Batch

# Runs run_fundamentals_pipeline() for every WATCHLIST ticker (the first
# production caller of the orchestrator). Fetches SEC companyfacts inside CI,
# then uploads the per-ticker results, summary, and the raw companyfacts
# (the raw files also serve as evidence for reviews such as GE B-1.C).
# workflow_dispatch works once this file is on the default branch; the push
# trigger covers the feature branch before then.
on:
  workflow_dispatch:
    inputs:
      evaluation_date:
        description: "Evaluation date (YYYY-MM-DD). Empty = today (UTC)."
        required: false
        default: ""
      tickers:
        description: "Optional comma-separated subset (e.g. GE,MSFT). Empty = all."
        required: false
        default: ""
  push:
    branches:
      - step15-batch-runner

jobs:
  fundamentals-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run fundamentals batch
        env:
          PYTHONPATH: ${{ github.workspace }}
          SEC_USER_AGENT: "invest-briefing-claude/0.1 chks7788@gmail.com"
          EVAL_DATE: ${{ github.event.inputs.evaluation_date }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          ARGS=(--output-dir out/fundamentals_batch --raw-dir data/raw/sec)
          if [ -n "$EVAL_DATE" ]; then ARGS+=(--evaluation-date "$EVAL_DATE"); fi
          if [ -n "$TICKERS" ]; then ARGS+=(--tickers "$TICKERS"); fi
          python scripts/run_fundamentals_batch.py "${ARGS[@]}"

      - name: Upload batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-batch-results
          path: out/fundamentals_batch

      - name: Upload raw companyfacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-companyfacts-raw
          path: data/raw/sec
          if-no-files-found: ignore
