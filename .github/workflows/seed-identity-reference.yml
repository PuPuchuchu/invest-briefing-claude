name: Seed Identity Reference Data

on:
  workflow_dispatch:

jobs:
  seed-identity-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Seed identity reference data
        env:
          SEC_USER_AGENT: "invest-briefing-claude/0.1 chks7788@gmail.com"
        run: |
          python scripts/seed_identity_reference.py

      - name: Upload seeded reference data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-reference-seed
          path: |
            data/raw/sec/
            data/reference/
